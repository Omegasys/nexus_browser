name = "nexus-tor"

display_name = "Nexus Tor Network Engine"

version = "0.1.0"

engine_type = "network"


description = """
Independent Tor routing subsystem
for Nexus Browser.
"""


[features]

circuit_management = true

bridge_support = true

onion_services = true

identity_isolation = true

network_lock = true

hot_reload = true


[security]

traffic_leak_prevention = true

process_isolation = true

microvm_support = true

dns_isolation = true


[integration]

vpn = true

i2p = true

nym = true

lokinet = true

direct = true
