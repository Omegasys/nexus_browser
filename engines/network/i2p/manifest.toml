name = "nexus-i2p"

display_name = "Nexus I2P Network Engine"

version = "0.1.0"

engine_type = "network"


description = """
Independent I2P anonymous networking
subsystem for Nexus Browser.
"""


[features]

router_management = true

tunnel_management = true

destination_isolation = true

network_lock = true

hot_reload = true


[security]

traffic_leak_prevention = true

process_isolation = true

microvm_support = true

dns_isolation = true


[integration]

vpn = true

tor = true

nym = true

lokinet = true

direct = true
