name = "nexus-lokinet"

display_name = "Nexus Lokinet Network Engine"

version = "0.1.0"

engine_type = "network"


description = """
Independent Lokinet LLARP routing
subsystem for Nexus Browser.
"""


[features]

llarp_routing = true

tunnel_management = true

route_management = true

network_lock = true

hot_reload = true


[security]

traffic_leak_prevention = true

process_isolation = true

microvm_support = true

dns_isolation = true

identity_separation = true


[integration]

vpn = true

tor = true

i2p = true

nym = true

direct = true
